<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GoTP logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="152" y1="120" x2="360" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle signal arcs (top-right), hinting SMS delivery -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M348 176 a56 56 0 0 1 44 44"/>
    <path d="M336 140 a92 92 0 0 1 72 72"/>
  </g>

  <!-- Shield = the fraud guard -->
  <path d="M256 116 L360 156 L360 262 C360 332 312 376 256 396 C200 376 152 332 152 262 L152 156 Z"
        fill="url(#shieldGrad)" filter="url(#soft)"/>

  <!-- Verified check inside the shield -->
  <path d="M210 262 L244 296 L308 216"
        stroke="#4F46E5" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
