# Deploy the `staging` branch to the staging instance (:8081) on the VPS.
# Flow: test -> build & push image -> deploy over SSH.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AT_REGISTRY           registry host (from the Marketplace submission form)
#   AT_REGISTRY_USERNAME  registry username
#   AT_REGISTRY_PASSWORD  registry password / token
#   STAGING_HOST          VPS host or IP
#   STAGING_USER          SSH user for the staging deploy
#   STAGING_SSH_KEY       private SSH key for that user
name: deploy-staging

on:
  push:
    branches: [staging]

jobs:
  # Reuse the shared gate — no deploy without green tests.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image=${{ secrets.AT_REGISTRY }}/gotp:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to the AT container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AT_REGISTRY }}
          username: ${{ secrets.AT_REGISTRY_USERNAME }}
          password: ${{ secrets.AT_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ needs.build-and-push.outputs.image }}
            docker rm -f gotp-staging || true
            docker run -d --name gotp-staging \
              --restart unless-stopped \
              --env-file /opt/gotp-staging/.env \
              -p 8081:4000 \
              ${{ needs.build-and-push.outputs.image }}
